<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Office Operations Console</title>
<style>
:root{color-scheme:light;--ink:#172b42;--muted:#65758a;--blue:#375be8;--line:#e0e6ef;--bg:#f4f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #fbaf35;outline-offset:3px}a{color:var(--blue)}header{background:#172b42;color:white;padding:22px max(24px,calc((100vw - 1320px)/2))}h1{font-size:25px;margin:0}header p{color:#b8c7da;margin:5px 0}main{max-width:1368px;padding:24px;margin:auto}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{border:0;padding:12px 18px;background:transparent;color:var(--muted);border-radius:8px}nav button[aria-current=page]{background:var(--ink);color:white}.toolbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.filters label{font-size:12px;color:var(--muted);display:grid;gap:3px}input,select{background:white;border:1px solid #b8c5d6;border-radius:6px;padding:7px;max-width:190px}#search{max-width:none;width:230px}.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:32px}.chip,.plain{border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:white;color:var(--ink)}.chip{background:#e9eeff;color:#294ac4}.cards,.grid{display:grid;gap:16px;margin:20px 0}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card,section{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}.card b{display:block;font-size:28px;margin:8px 0}.muted,small,footer{color:var(--muted)}h2{font-size:16px;margin:0 0 16px}p{margin:8px 0}.wide{grid-column:1/-1}.chart{width:100%;height:230px;display:block}.chart text{font:12px system-ui;fill:var(--muted)}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.legend button{border:1px solid var(--line);border-radius:6px;background:white;padding:5px 8px}.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.bars{display:grid;gap:8px;max-height:330px;overflow:auto}.bar{display:grid;grid-template-columns:minmax(90px,1fr) 2fr 95px;gap:10px;align-items:center;width:100%;border:0;border-radius:6px;background:transparent;text-align:left;padding:7px}.bar:hover{background:#f0f3ff}.bar span{overflow-wrap:anywhere}.track{height:10px;background:#edf0f6;border-radius:6px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:6px}.bar small{text-align:right}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted)}th button{border:0;background:transparent;padding:0;color:inherit;text-align:left}.title-button{border:0;background:transparent;padding:0;text-align:left;color:var(--blue);font-weight:600}.badge{display:inline-block;border-radius:4px;background:#edf0f6;padding:3px 6px;font-size:11px}.COMPLETED{background:#e4f7ef;color:#176d4d}.PARTIAL{background:#fff2d8;color:#8a6100}.BLOCKED{background:#ffe5e9;color:#a42940}.pagination{display:flex;gap:12px;align-items:center;margin-top:14px;justify-content:flex-end}.timeline{list-style:none;padding:0;margin:0;max-height:450px;overflow:auto}.timeline li{padding:12px 0 12px 14px;border-left:2px solid #dae2ff;margin-left:4px}.timeline small{display:block}footer{margin:22px 0;font-size:12px}.archives{display:flex;gap:12px;margin-top:12px}dialog{border:1px solid var(--line);border-radius:12px;max-width:780px;width:calc(100vw - 32px);max-height:90vh;padding:24px}dialog::backdrop{background:#172b4280}dialog .close{float:right}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 system-ui;background:var(--bg);padding:16px;border-radius:8px}.empty{padding:25px;color:var(--muted);text-align:center}@media(max-width:800px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}main{padding:14px}.toolbar{position:static}.bar{grid-template-columns:100px 1fr 80px}header{padding:20px}.filters label{flex:1}input,select{max-width:100%;width:100%}#search{width:100%}}
</style>
<header><h1>AI Office <span style="font-weight:400">Operations Console</span></h1><p id="subtitle"></p></header>
<main><div class="toolbar"><nav id="tabs" aria-label="Dashboard view"></nav><div class="filters" id="filters"></div><div class="chips" id="chips" aria-live="polite"></div></div><div class="cards" id="cards"></div><div class="grid" id="content"></div><footer>Markdown 기반 스냅샷 · MD는 사람 기준의 상대적 업무량 추정치입니다. 실행 시간·Token·인사 평가와 무관합니다. 대표 MD: Final → 기존 md → Estimated. 미기록은 0으로 추정하지 않습니다.<div class="archives" id="archives"></div></footer></main>
<dialog id="detail"><button class="plain close" id="close">닫기</button><div id="detail-body"></div></dialog>
<script type="application/json" id="data">__DATA__</script>
<script>
// STATE_START: pure functions also exercised by check_dashboard.cjs.
const defaults={view:'overview',period:'current',project:'',status:'',work_status:'',size:'',role:'',model:'',from:'',to:'',search:'',health:'',sort:'date',direction:'desc',page:1,grain:'daily',metric:'count'};
const healthFields={metadata:r=>r.metadata,md:r=>r.md!==null,ticket:r=>!!r.ticket,project:r=>r.project!=='UNKNOWN',size:r=>r.size!=='UNKNOWN'};
function decodeState(hash,period='current'){const params=new URLSearchParams(hash.replace(/^#/,'')),s={...defaults,period};for(const key of Object.keys(s))if(params.has(key))s[key]=params.get(key);if(!['overview','analytics','history','health'].includes(s.view))s.view='overview';if(!['current','daily','weekly','monthly'].includes(s.period))s.period=period;if(!['daily','weekly'].includes(s.grain))s.grain='daily';if(!['count','md'].includes(s.metric))s.metric='count';if(!['date','title','status','work_status','size','md','project'].includes(s.sort))s.sort='date';s.direction=s.direction==='asc'?'asc':'desc';s.page=Number.isFinite(Number(s.page))?Math.max(1,Math.floor(Number(s.page)||1)):1;if(!Object.prototype.hasOwnProperty.call(healthFields,s.health))s.health='';return s}
function encodeState(s){return new URLSearchParams(Object.entries(s).filter(([k,v])=>v!==''&&(v!==defaults[k]||k==='period'))).toString()}
function matches(r,s){return(!s.project||r.project===s.project)&&(!s.status||r.status===s.status)&&(!s.work_status||(r.work_status||'UNKNOWN')===s.work_status)&&(!s.size||r.size===s.size)&&(!s.role||r.agents.includes(s.role))&&(!s.model||r.models.includes(s.model))&&(!s.from||!!r.date&&r.date>=s.from)&&(!s.to||!!r.date&&r.date<=s.to)&&(!s.health||!healthFields[s.health](r))&&(!s.search||[r.title,r.ticket,r.project,...r.agents,...r.models].join(' ').toLocaleLowerCase().includes(s.search.toLocaleLowerCase()))}
function sum(rows,key='md'){const values=rows.map(r=>r[key]).filter(v=>v!==null&&v!==undefined);return values.length?values.reduce((a,b)=>a+b,0):null}
function groups(rows,key,md=false){const map=new Map();for(const r of rows)for(const value of Array.isArray(r[key])?r[key]:[r[key]||'날짜 미기록']){if(!map.has(value))map.set(value,[]);map.get(value).push(r)}return [...map].map(([label,rs])=>[label,md?sum(rs):rs.length]).sort((a,b)=>(b[1]??-1)-(a[1]??-1)||a[0].localeCompare(b[0]))}
function sortedRows(rows,s){return [...rows].sort((a,b)=>{const x=a[s.sort],y=b[s.sort];if(x===null||x===undefined)return y===null||y===undefined?0:1;if(y===null||y===undefined)return -1;const c=typeof x==='number'?x-y:String(x).localeCompare(String(y));return(s.direction==='asc'?c:-c)||a.path.localeCompare(b.path)})}
function trendRows(rows,grain){const map=new Map();for(const r of rows){if(!r.date)continue;const day=new Date(r.date+'T00:00:00Z');if(grain==='weekly')day.setUTCDate(day.getUTCDate()-((day.getUTCDay()+6)%7));const from=day.toISOString().slice(0,10);if(!map.has(from))map.set(from,[]);map.get(from).push(r)}return [...map].sort((a,b)=>a[0].localeCompare(b[0])).map(([from,rs])=>{const end=new Date(from+'T00:00:00Z');end.setUTCDate(end.getUTCDate()+(grain==='weekly'?6:0));return {from,to:end.toISOString().slice(0,10),count:rs.length,md:sum(rs)}})}
// STATE_END
const data=JSON.parse(document.getElementById('data').textContent),content=document.getElementById('content'),cards=document.getElementById('cards'),palette=['#375be8','#e4a328','#dc5570','#8795ab','#25a47b'];
let state=decodeState(location.hash,data.view),visible=[];
const fmt=v=>v===null||v===undefined?'미기록':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:4});
function node(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n}
function button(text,parent,action,cls='plain'){const b=node('button',text,parent);b.type='button';b.className=cls;b.addEventListener('click',action);return b}
function link(text,url,parent){const a=node('a',text,parent);a.href=url;return a}
function section(title,wide=false){const s=node('section',undefined,content);if(wide)s.className='wide';node('h2',title,s);return s}
function update(patch){state={...state,...patch,page:patch.page??1};const hash=encodeState(state);if(location.hash.slice(1)===hash)render();else location.hash=hash}
function toggle(key,value){update({[key]:state[key]===value?'':value})}
function svg(tag,attrs,parent){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(parent)parent.append(n);return n}
function actionable(n,label,action){n.setAttribute('tabindex','0');n.setAttribute('role','button');n.setAttribute('aria-label',label);n.style.cursor='pointer';svg('title',{},n).textContent=label;n.addEventListener('click',action);n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action()}})}
function bars(title,values,key,unit=''){const s=section(title),box=node('div',undefined,s);box.className='bars';if(!values.length){node('p','기록 없음',box);return}const max=Math.max(1,...values.map(x=>x[1]??0));for(const[label,value]of values){const b=button('',box,()=>toggle(key,label),'bar');b.title=label+' · '+fmt(value)+unit;b.setAttribute('aria-pressed',String(state[key]===label));node('span',label,b);const t=node('div',undefined,b);t.className='track';const f=node('div',undefined,t);f.className='fill';f.style.width=(100*(value??0)/max)+'%';node('small',fmt(value)+(value===null?'':unit),b)}}
function donut(rows){const s=section('Completion · 전체 상태를 클릭하여 탐색'),values=groups(rows,'status'),total=rows.length,chart=svg('svg',{viewBox:'0 0 400 230',class:'chart','aria-label':'전체 상태 분포'},s);let offset=0;values.forEach(([label,value],i)=>{const length=total?value/total*100:0,c=svg('circle',{cx:200,cy:110,r:76,fill:'none',stroke:palette[i%palette.length],'stroke-width':23,pathLength:100,'stroke-dasharray':length+' '+(100-length),'stroke-dashoffset':-offset,transform:'rotate(-90 200 110)'},chart);actionable(c,label+' '+value+'건',()=>toggle('status',label));offset+=length});svg('text',{x:200,y:105,'text-anchor':'middle',style:'font-size:26px;fill:#172b42'},chart).textContent=total?fmt(rows.filter(r=>r.status==='COMPLETED').length/total*100)+'%':'—';svg('text',{x:200,y:128,'text-anchor':'middle'},chart).textContent='전체 완료율';const legend=node('div',undefined,s);legend.className='legend';values.forEach(([label,value],i)=>{const b=button(label+' '+value,legend,()=>toggle('status',label),'');b.setAttribute('aria-pressed',String(state.status===label));const sw=node('span',undefined,b);sw.className='swatch';sw.style.background=palette[i%palette.length];b.prepend(sw)});if(!total)node('p','기록 없음',s)}
function trend(rows){const s=section('Workload Trend · 기간을 클릭하여 탐색');for(const[key,label,options]of [['grain','집계 단위',[['daily','일별'],['weekly','주별']]],['metric','업무량 지표',[['count','업무 건수'],['md','대표 MD']]]]){const l=node('label',label+' ',s),n=node('select',undefined,l);n.setAttribute('aria-label',label);for(const[value,text]of options){const o=node('option',text,n);o.value=value}n.value=state[key];n.addEventListener('change',()=>update({[key]:n.value}))}const values=trendRows(rows,state.grain);if(!values.length){node('p','날짜 기록 없음',s);return}const width=Math.max(480,values.length*32),scroll=node('div',undefined,s);scroll.className='scroll';const chart=svg('svg',{viewBox:'0 0 '+width+' 230',class:'chart',style:'min-width:'+width+'px','aria-label':'기간별 '+(state.metric==='md'?'대표 MD':'업무 건수')},scroll),max=Math.max(1,...values.map(v=>v[state.metric]??0)),x=i=>42+i*(width-75)/Math.max(1,values.length-1),y=v=>180-v/max*140;svg('line',{x1:30,y1:180,x2:width-15,y2:180,stroke:'#e0e6ef'},chart);let previous=null;values.forEach((v,i)=>{const value=v[state.metric];if(value===null){previous=null;const t=svg('text',{x:x(i),y:170,'text-anchor':'middle'},chart);t.textContent='미기록';return}if(previous)svg('line',{x1:previous.x,y1:previous.y,x2:x(i),y2:y(value),stroke:palette[0],'stroke-width':3},chart);previous={x:x(i),y:y(value)};const c=svg('circle',{cx:x(i),cy:y(value),r:7,fill:palette[0],stroke:'white','stroke-width':2},chart);actionable(c,v.from+' ~ '+v.to+' · '+v.count+'건 · '+fmt(v.md)+' MD',()=>update({from:v.from,to:v.to}));svg('text',{x:x(i),y:y(value)-14,'text-anchor':'middle'},chart).textContent=fmt(value)});values.forEach((v,i)=>{if(i===0||i===values.length-1||values.length<9)svg('text',{x:x(i),y:205,'text-anchor':'middle'},chart).textContent=v.from.slice(5)});node('small','기간 클릭 → 업무 목록 필터 · hover / focus → 건수와 대표 MD · 미기록 MD는 점을 그리지 않습니다.',s)}
function estimated(rows){const s=section('Estimated vs Final · 기록된 업무만'),paired=rows.filter(r=>r.estimated_md!==null&&r.final_md!==null);node('p','Estimated '+fmt(sum(rows,'estimated_md'))+' MD / Final '+fmt(sum(rows,'final_md'))+' MD',s);node('p','두 값 모두 기록: '+paired.length+'건 · 차이 합계 '+fmt(paired.length?sum(paired,'final_md')-sum(paired,'estimated_md'):null)+' MD',s);const chart=svg('svg',{viewBox:'0 0 400 230',class:'chart','aria-label':'업무별 Estimated 대 Final MD 산점도'},s),max=Math.max(1,...paired.flatMap(r=>[r.estimated_md,r.final_md])),x=v=>40+v/max*320,y=v=>185-v/max*145;svg('line',{x1:40,y1:185,x2:360,y2:40,stroke:'#a7b5cd','stroke-dasharray':'5 5'},chart);for(const r of paired){const c=svg('circle',{cx:x(r.estimated_md),cy:y(r.final_md),r:6,fill:palette[0],opacity:.7},chart);actionable(c,r.title+' · Estimated '+fmt(r.estimated_md)+' / Final '+fmt(r.final_md),()=>detail(r))}svg('text',{x:200,y:220,'text-anchor':'middle'},chart).textContent='Estimated MD →';svg('text',{x:12,y:23},chart).textContent='Final MD ↑';if(!paired.length)node('p','비교할 값이 모두 기록된 업무가 없습니다.',s)}
function workStatus(r){return r.work_status||'UNKNOWN'}
function recordingPending(r){return workStatus(r)==='COMPLETED'&&r.status!=='COMPLETED'}
function detail(r){const body=document.getElementById('detail-body');body.replaceChildren();node('h2',r.title,body);node('p',[r.date||'날짜 미기록',r.ticket||'Ticket 없음',r.project,'전체 '+r.status,'업무 '+workStatus(r),r.size].join(' · '),body);if(recordingPending(r))node('p','업무 완료 · 기록 미완료',body);node('p','Estimated / Final / 대표 MD: '+[r.estimated_md,r.final_md,r.md].map(fmt).join(' / '),body);node('p','Role: '+(r.agents.join(', ')||'미기록')+' · Model: '+(r.models.join(', ')||'미기록'),body);link('원본 Markdown 열기',r.url,body);node('pre',r.content||'본문 없음',body);document.getElementById('detail').showModal()}
function table(title,rows,limit){const s=section(title,true);if(!rows.length){node('p','조건에 맞는 업무가 없습니다.',s).className='empty';return}let records=sortedRows(rows,state),page=Math.min(state.page,Math.max(1,Math.ceil(records.length/25)));if(limit)records=records.slice(0,limit);else records=records.slice((page-1)*25,page*25);const scroll=node('div',undefined,s);scroll.className='scroll';const t=node('table',undefined,scroll),head=node('tr',undefined,node('thead',undefined,t));for(const[key,label]of[['date','날짜'],['title','업무 / Ticket'],['status','전체 상태'],['work_status','업무 상태'],['size','Size'],['md','대표 MD'],['project','Project']]){const th=node('th',undefined,head);th.scope='col';th.setAttribute('aria-sort',state.sort===key?(state.direction==='asc'?'ascending':'descending'):'none');button(label+(state.sort===key?(state.direction==='asc'?' ↑':' ↓'):''),th,()=>update({sort:key,direction:state.sort===key&&state.direction==='desc'?'asc':'desc'}),'')}const body=node('tbody',undefined,t);for(const r of records){const tr=node('tr',undefined,body);node('td',r.date||'미기록',tr);const td=node('td',undefined,tr);button(r.title,td,()=>detail(r),'title-button');node('br',undefined,td);node('small',r.ticket||'Ticket 없음',td);node('span',r.status,node('td',undefined,tr)).className='badge '+r.status;const ws=node('td',undefined,tr);node('span',workStatus(r),ws).className='badge '+workStatus(r);if(recordingPending(r)){node('br',undefined,ws);node('small','업무 완료 · 기록 미완료',ws)}node('td',r.size,tr);const md=node('td',fmt(r.md),tr);md.title='Estimated '+fmt(r.estimated_md)+' / Final '+fmt(r.final_md);node('td',r.project,tr)}const pager=node('div',undefined,s);pager.className='pagination';if(limit){node('small',rows.length+'건 중 '+records.length+'건 표시',pager);button('전체 History →',pager,()=>update({view:'history'}))}else{button('이전',pager,()=>update({page:page-1})).disabled=page<=1;node('span',page+' / '+Math.ceil(rows.length/25)+' · '+rows.length+'건',pager);button('다음',pager,()=>update({page:page+1})).disabled=page*25>=rows.length}}
function decisions(all,limit){const s=section(state.view==='history'?'Decision Timeline':'주요 Decision',true);node('small','Decision에는 기간·날짜만 적용합니다. Project / Role / Model / 검색과 업무 연결은 추정하지 않습니다.',s);const choices=all.filter(d=>(!state.from||d.date&&d.date>=state.from)&&(!state.to||d.date&&d.date<=state.to)).slice().reverse().sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!choices.length)node('p','이 기간의 결정 기록이 없습니다.',s);const ul=node('ul',undefined,s);ul.className='timeline';for(const d of limit?choices.slice(0,limit):choices){const li=node('li',undefined,ul);node('small',d.date||'날짜 미기록',li);link(d.text,d.url,li)}}
function controls(){const box=document.getElementById('filters');box.replaceChildren();function select(key,label,values){const l=node('label',label,box),n=node('select',undefined,l);n.setAttribute('aria-label',label);for(const[value,text]of values){const o=node('option',text,n);o.value=value}n.value=state[key];n.addEventListener('change',()=>update({[key]:n.value}));return n}select('period','집계 기간',[['current','전체 / 최신'],['daily','일간'],['weekly','주간'],['monthly','월간']]);const rows=data.periods[state.period].reports;for(const[key,label,field]of[['project','Project','project'],['status','전체 상태','status'],['work_status','업무 상태','work_status'],['size','Size','size'],['role','Role','agents'],['model','Model','models']]){const values=groups(rows,field).map(v=>v[0]).sort();if(state[key]&&!values.includes(state[key]))values.push(state[key]);select(key,label,[['','전체'],...values.map(v=>[v,v])])}for(const[key,label,type]of[['from','시작 날짜','date'],['to','종료 날짜','date'],['search','업무 검색','search']]){const l=node('label',label,box),n=node('input',undefined,l);n.type=type;n.value=state[key];n.setAttribute('aria-label',label);if(key==='search'){n.id='search';n.placeholder='업무 / Ticket / Project / Role / Model';n.addEventListener('change',()=>update({search:n.value}))}else n.addEventListener('change',()=>update({[key]:n.value}))}const chips=document.getElementById('chips');chips.replaceChildren();node('small',visible.length+' / '+rows.length+'건',chips);for(const key of ['project','status','work_status','size','role','model','from','to','search','health'])if(state[key])button(key+': '+state[key]+' ×',chips,()=>update({[key]:''}),'chip');button('필터 초기화',chips,()=>update({...defaults,view:state.view,period:state.period}));if(state.from&&state.to&&state.from>state.to)node('small','시작 날짜가 종료 날짜보다 늦습니다.',chips)}
function render(){const p=data.periods[state.period];visible=p.reports.filter(r=>matches(r,state));content.replaceChildren();cards.replaceChildren();document.getElementById('subtitle').textContent=data.date+' · '+data.timezone+' · '+(p.start?p.start+' ~ '+p.end+' (종료일 제외)':'전체 기록')+' · 실시간 상태가 아닌 기록 스냅샷';const tabs=document.getElementById('tabs');tabs.replaceChildren();for(const[key,label]of[['overview','Overview'],['analytics','Analytics'],['history','History'],['health','Health']]){const b=button(label,tabs,()=>update({view:key}),'');if(state.view===key)b.setAttribute('aria-current','page')}controls();const metrics=[['필터 업무',visible.length],['전체 완료 미확인',visible.filter(r=>r.status!=='COMPLETED').length],['대표 MD',fmt(sum(visible))],['MD 기록',visible.filter(r=>r.md!==null).length+' / '+visible.length]];for(const[label,value]of metrics){const c=node('div',undefined,cards);c.className='card';node('small',label,c);node('b',value,c)}if(state.view==='overview'){donut(visible);trend(visible);bars('Project Workload · 업무 건수',groups(visible,'project'),'project','건');bars('가장 많은 MD · 프로젝트',groups(visible,'project',true),'project',' MD');table('Recent Operations',visible,10);decisions(p.decisions,5)}else if(state.view==='analytics'){const avg=section('평균 MD · 기록된 업무 기준');const count=visible.filter(r=>r.md!==null).length;node('p',fmt(count?sum(visible)/count:null)+' MD · 기록 '+count+' / '+visible.length+'건',avg);estimated(visible);bars('Project · 대표 MD',groups(visible,'project',true),'project',' MD');bars('Size Distribution',groups(visible,'size'),'size','건');bars('Role Activity · 참여 업무',groups(visible,'agents'),'role','건');bars('Model Usage · 확인된 실제 모델',groups(visible,'models'),'model','건');const averages=groups(visible,'size').map(([k])=>{const rs=visible.filter(r=>r.size===k),count=rs.filter(r=>r.md!==null).length;return[k,count?sum(rs)/count:null]});bars('Size별 평균 MD',averages,'size',' MD');table('MD 분석 · 열 제목으로 정렬',visible,10)}else if(state.view==='history'){table('전체 업무 기록',visible);decisions(p.decisions);table('Core Changes · type: core',visible.filter(r=>r.type==='core'),10)}else{const base=p.reports.filter(r=>matches(r,{...state,health:''}));for(const[key,label]of Object.entries({metadata:'Metadata',md:'MD',ticket:'Ticket',project:'Project',size:'Size'})){const known=base.filter(healthFields[key]).length,s=section(label+' Coverage');node('p',known+' / '+base.length+' · '+(base.length?fmt(known/base.length*100)+'%':'—'),s);const t=node('div',undefined,s);t.className='track';const f=node('div',undefined,t);f.className='fill';f.style.width=(base.length?known/base.length*100:0)+'%';button('미기록 '+(base.length-known)+'건 탐색',s,()=>toggle('health',key));node('p',key==='metadata'?'Frontmatter 존재 여부이며 모든 필드의 완전성을 뜻하지 않습니다.':'미기록 값은 추정하지 않습니다.',s).className='muted'}table('기록 품질 · 업무를 열어 원본 확인',visible,10)}}
document.getElementById('close').addEventListener('click',()=>document.getElementById('detail').close());window.addEventListener('hashchange',()=>{state=decodeState(location.hash,data.view);render()});for(const[label,url]of Object.entries(data.navigation))link(label+' snapshot',url,document.getElementById('archives'));render();
</script></html>
